# PR마다 포맷·린트·타입체크·테스트·빌드·의존성 취약점을 검증하는 CI. 배포(CD)는 Vercel이 담당한다.
name: CI

on:
  # 대상 브랜치를 열거하면 release/hotfix 케이스를 빠뜨리므로 모든 PR에서 실행
  pull_request:
  push:
    branches: [develop, main, release]

# 같은 브랜치에 새 푸시가 오면 진행 중이던 이전 실행을 취소 (Actions 분량 절약)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # pnpm 버전은 package.json의 packageManager 필드를 그대로 읽는다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 알려진 취약점이 있는 의존성이 들어오면 막는다 (어드민은 공급망 사고의 피해가 크다).
      # npm 감사 API가 응답을 못 하는 날(ERR_SOCKET_TIMEOUT)이 있어 그 경우만 경고로 두고 통과시킨다 —
      # 취약점이 나오면 여전히 실패다. 장애로 통과한 PR은 머지 전 로컬에서 pnpm audit --prod를 한 번 더 돌린다
      - name: 의존성 취약점 검사
        run: |
          set +e
          output=$(pnpm audit --prod --audit-level=high 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 0 ] && echo "$output" | grep -q "ERR_SOCKET_TIMEOUT\|FetchError"; then
            echo "::warning title=의존성 취약점 검사 건너뜀::npm 감사 API가 응답하지 않아 검사를 마치지 못했다. 머지 전 로컬에서 pnpm audit --prod --audit-level=high 를 돌려 확인한다"
            exit 0
          fi
          exit "$status"

      - name: 포맷 검사 (Prettier)
        run: pnpm format:check

      - name: 린트
        run: pnpm lint

      - name: 타입체크
        run: pnpm typecheck

      - name: 테스트
        run: pnpm test

      - name: 빌드
        run: pnpm build
