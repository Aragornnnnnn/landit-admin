# PR·이슈에서 @claude를 멘션하면 Claude가 답한다 (리뷰·질문·수정 제안).
#
# 자동 리뷰(pull_request 트리거)는 일부러 걸지 않았다 — 모든 PR·모든 푸시마다 돌면 Claude 사용량이
# 빠르게 닳는다. 넓게 훑는 자동 리뷰는 Gemini(.gemini/config.yaml)가 맡고, Claude는 깊게 봐야 할 때
# 사람이 부른다. 자동으로 돌리고 싶어지면 pull_request 트리거와 prompt를 추가하되 사용량을 먼저 보라.
#
# 필요한 시크릿 (레포 Settings → Secrets → Actions)
#   CLAUDE_CODE_OAUTH_TOKEN — 로컬에서 `claude setup-token`으로 발급. 발급한 사람의 구독 한도를 쓴다.
#   (조직이 함께 쓰려면 ANTHROPIC_API_KEY로 바꾼다 — 이쪽은 사용량만큼 과금된다)
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # 멘션이 있을 때만 실행 — 그 외 코멘트는 Actions 분도 쓰지 않는다
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 저장소 루트의 CLAUDE.md(= AGENTS.md)를 자동으로 읽는다 — 보안 규칙·구조·컨벤션이 그대로 적용된다.
          # 사용량을 아끼려고 턴 수를 제한하고 Sonnet을 쓴다. 더 깊게 봐야 하면 멘션에 적어 요청한다
          claude_args: '--max-turns 15 --model claude-sonnet-5'
